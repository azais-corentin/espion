# Host workspace. Builds for the host target only.
#
# firmware/p4-c5-link is a member so its host-side unit tests run with `cargo test`; the
# firmware binaries (cam-p4, radio-c5) are excluded: they have their own targets, runners
# and lockfiles, and are built from their own directories.
[workspace]
resolver = "3"
members  = ["crates/*", "host/*", "firmware/p4-c5-link"]
exclude  = ["firmware/cam-p4", "firmware/radio-c5", "firmware/vendor"]

[workspace.package]
edition      = "2024"
rust-version = "1.99"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/azais-corentin/espion"
publish      = false

[workspace.dependencies]
# Shared, no_std
espion-proto = { path = "crates/espion-proto" }
p4-c5-link   = { path = "firmware/p4-c5-link" }
postcard     = { version = "1.1.3", default-features = false }
serde        = { version = "1.0.229", default-features = false, features = ["derive"] }

# Host only
anyhow             = "1.0.104"
clap               = { version = "4.6.7", features = ["derive"] }
eframe             = "0.37.0"
nalgebra           = "0.35.0"
tokio              = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
