# Host workspace. Builds for the host target only.
#
# The firmware crates (cam-p4, esp32p4-csi, ov9281, poc-p4-eth) are excluded: they have their
# own target, runner and lockfile, and are built from their own directories.
[workspace]
resolver = "3"
members  = ["crates/*", "host/*"]
exclude  = ["firmware/cam-p4", "firmware/esp32p4-csi", "firmware/ov9281", "firmware/poc-p4-eth"]

[workspace.package]
edition      = "2024"
rust-version = "1.99"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/azais-corentin/espion"
publish      = false

[workspace.dependencies]
# Shared, no_std
espion-proto = { path = "crates/espion-proto" }
# OV9281 mode solver, host-buildable; outside the workspace (firmware crate, own lockfile).
ov9281       = { path = "firmware/ov9281" }
postcard     = { version = "1.1.3", default-features = false }
serde        = { version = "1.0.229", default-features = false, features = ["derive"] }

# Host only
anyhow             = "1.0.104"
clap               = { version = "4.6.7", features = ["derive"] }
eframe             = "0.37.0"
nalgebra           = "0.35.0"
png                = "0.18.1"
socket2            = "0.6.5"
tokio              = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
