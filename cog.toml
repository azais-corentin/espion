# Conventional Commits rules, checked by the hk hooks in hk.pkl (commit-msg and pre-push).
# Commit types are cocogitto's defaults: feat, fix, docs, chore, refactor, test, build, ci,
# perf, style, revert.

# Allowed scopes. A commit may also have no scope. A new crate, board or tool adds its
# scope here.
scopes = [
  # hardware/espion-cam: the camera board.
  "espion-cam",
  # docs/hardware and hardware-wide changes.
  "hardware",
  # hardware/lib: symbols, footprints, 3D models.
  "hardware-lib",
  # .omp/extensions/kicad.
  "kicad-toolkit",
  # .omp skills.
  "skills",
  # crates/espion-proto.
  "proto",
  # firmware/cam-p4.
  "cam-p4",
  # firmware/esp32p4-csi.
  "esp32p4-csi",
  # firmware/esp32p4-jpeg: hardware JPEG encoder (greyscale) and 2D-DMA driver.
  "esp32p4-jpeg",
  # firmware/esp32p4-perf: cycle, instruction, branch and cache counters of the P4.
  "esp32p4-perf",
  # firmware/esp32p4-pie: PIE vector instruction encoders and kernels for the P4.
  "esp32p4-pie",
  # firmware/espion-vision: blob detector (threshold, connected components, centroids).
  "espion-vision",
  # firmware/ov9281: OV9281 sensor driver (mode solver and SCCB control).
  "ov9281",
  # firmware/poc-p4-eth: throwaway proof of concept on the Waveshare ESP32-P4-ETH.
  "poc-p4-eth",
  # firmware/poc-p4-stream: throwaway Ethernet and streaming proof of concept on the same board.
  "poc-p4-stream",
  # host/espion-server, espion-viewer, espion-calib, espion-sync.
  "server",
  "viewer",
  "calib",
  "sync",
  # host/poc-viewer: viewer and fake camera for the ESP32-P4-ETH camera stream.
  "poc-viewer",
  # flake.nix, flake.lock and the dev shell.
  "nix",
]

ignore_merge_commits = true
# fixup!/squash!/amend! commits are allowed locally (the commit-msg hook passes
# --ignore-fixup-commits) but the pre-push hook rejects them: fold them before pushing.
ignore_fixup_commits = false
