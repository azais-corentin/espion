# Compilation settings. User/runtime settings live in esp-config.toml.
include = ["esp-config.toml"]

[target.riscv32imafc-unknown-none-elf]
# The dev board's USB-C goes through a CH343 USB-UART bridge to UART0: /dev/ttyACM0.
runner = "espflash flash --monitor --chip esp32p4 --port /dev/ttyACM0"

[build]
target = "riscv32imafc-unknown-none-elf"
# No `-C force-frame-pointers`: frame pointers cost the detector 1 to 3 % of its cycles
# (firmware/poc-p4-eth/README.md, "Frame pointers"). Without them a panic prints its message
# and location, then a stack dump that `espflash monitor --elf` decodes into a backtrace (not
# with `--no-addresses`). For esp-backtrace's frame-pointer walk instead, build with
#   cargo build --release --config .cargo/backtrace.toml
#
# Zba, Zbb, Zbs and Zcb: 2 to 4.5 % fewer detector instructions and 3 to 4.7 % fewer cycles
# with blobs (README, "Hot code in RAM and Zb/Zcb"). `+zcmp` stays off (silicon erratum, see
# ESP-IDF's components/riscv check_zcmp_workaround) and `+zicond` too (not on the chip).
rustflags = ["-C", "target-feature=+zba,+zbb,+zbs,+zcb"]
