[package]
name         = "poc-p4-eth"
description  = "Throwaway proof of concept on the Waveshare ESP32-P4-ETH: PSRAM, memory read speed, OV9281 SCCB, MIPI CSI capture, vision timing"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.99"
license      = "MIT OR Apache-2.0"
publish      = false

[features]
# Marker pins (README, "Marker pins"): dedicated-IO channels toggled at strip taken and frame
# done by the strip soak (core 0) and the runner (core 1), the boot self-check that reads them
# back, and the sensor's STROBE output on. Off by default.
markers = ["espion-core1/markers"]

[dependencies]
esp32p4-cache = { path = "../esp32p4-cache" }
esp32p4-csi   = { path = "../esp32p4-csi" }
esp32p4-jpeg  = { path = "../esp32p4-jpeg" }
esp32p4-perf  = { path = "../esp32p4-perf" }
esp32p4-pie   = { path = "../esp32p4-pie" }
# The detector on a bare core 1 (`RUN_CORE1`). `stats`: the cache lock's hold and wait maxima
# in its monitor's log lines.
espion-core1  = { path = "../espion-core1", features = ["stats"] }
# `ram`: the detector's hot functions and the PIE kernels in internal RAM (README, "Hot code
# in RAM and Zb/Zcb").
espion-vision = { path = "../espion-vision", features = ["pie", "ram"] }
ov9281        = { path = "../ov9281" }

esp-hal = { version = "~1.2.2", features = ["esp32p4", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32p4", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32p4", "log-04"] }
esp-backtrace = { version = "0.20.0", features = ["esp32p4", "panic-handler", "println"] }
# Logs go to UART0 (GPIO37 TX, GPIO38 RX), wired to the board's CH343 USB-UART bridge. The
# P4's USB Serial/JTAG is not on the USB-C port of this board, so `auto` is not needed.
esp-println = { version = "0.18.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32p4",
  "log-04",
  "uart",
] }
# Cache configuration registers. Same major as esp-hal 1.2.2 uses.
esp32p4 = { version = "0.3.0", features = ["critical-section"] }

critical-section = "1.2.0"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time     = { version = "0.5.1", features = ["log"] }
embassy-futures  = "0.1.2"
log              = "0.4.34"
static_cell      = "2.1.1"

[profile.dev]
# The default debug profile is too slow and too big for the vision loop.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = 3
