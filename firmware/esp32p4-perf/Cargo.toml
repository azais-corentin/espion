[package]
name         = "esp32p4-perf"
description  = "Performance and cache counters of the ESP32-P4 HP cores, and dedicated-IO marker pins (no_std, no dependencies)"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.99"
license      = "MIT OR Apache-2.0"
publish      = false

# No dependencies: the cache counters are read with raw volatile loads at the offsets
# documented in src/lib.rs, so the crate needs no PAC, HAL, RTOS or critical section and
# works from a bare second core.
[dependencies]
