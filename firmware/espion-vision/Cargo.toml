[package]
name         = "espion-vision"
description  = "Marker blob detector for RAW8 and packed RAW10 mono frames, and a synthetic frame generator (no_std, no heap)"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.99"
license      = "MIT OR Apache-2.0"
publish      = false

# No .cargo/config.toml: the crate has no esp dependency by default, so `cargo test` runs on
# the host. Build for the P4 with `--target riscv32imafc-unknown-none-elf`.

[features]
# `impl Skip for esp32p4_pie::Pie`: the PIE dark skip of the ESP32-P4. The impl exists on
# RISC-V builds only; on the host the feature builds the dependency's encoders and adds
# nothing.
pie = ["dep:esp32p4-pie"]

[dependencies]
esp32p4-pie = { path = "../esp32p4-pie", optional = true }

[lints.rust]
missing_docs           = "warn"
# Not `unsafe_code = "forbid"`: the row scans and the skip reinterpret rows as `u32` words
# with `align_to`, and the component table is indexed by slots without bounds checks.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
